name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This server aims to stay small and safe. Every write must stay behind `confirm: true` and a `reason`. Requests that keep that are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job first. The solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the server to do?
      description: If it maps to an Apple API endpoint, link its documentation page.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: For example, calling the endpoint through `asc_request`.
